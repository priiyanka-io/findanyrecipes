<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rasoi — Profile</title>
<link rel="stylesheet" href="profile.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
  <div class="navbar-left">
    <a href="recipe.html" class="brand">Rasoi</a>
  </div>

  

  <div class="navbar-right" >
    <a class="favorite-btn" href="profile.html" id="favoriteBtn" aria-label="Favorites">
  ♡
</a>
    <button class="logout-btn" id="logoutBtn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Logout</span>
    </button>

    <a href="profile.html" class="nav-dp-link">
      <div class="nav-dp" id="navDp"></div>
    </a>
  </div>
</nav>

<section class="profile-section">
  <div class="profile-top">

    <div class="avatar" id="avatar">U</div>

    <div class="profile-info">
      <div class="profile-info-header">
        <div>
          <h2 id="userName">Loading...</h2>
          <div class="meta-row">
            <div>
 <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span id="joinedDate">Joined: Loading...</span>
            </div>
           <div>
            <svg
  xmlns="http://www.w3.org/2000/svg"
  width="18"
  height="18"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="12" cy="8" r="4"></circle>
  <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
</svg>
 <span id="userEmail">user: Loading...</span>
           </div>

            
          </div>
        </div>

        <a href="editBio.html" class="edit-btn">Edit Bio</a>
      </div>
    </div>
  </div>

  <div class="bio-block">
    <h3>Bio</h3>
    <p id="userBio">No bio added yet.</p>
  </div>
</section>


<section class="liked-section">
  <h3 class="liked-title">Saved Recipes</h3>
  <div class="liked-grid" id="likedRecipesGrid">
    
  </div>
</section>


<div class="recipe-modal" id="recipeModal">
  <div class="recipe-modal-content">
    <button class="recipe-modal-close" id="recipeModalClose">&times;</button>
    <div id="recipeModalBody"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="logout.js"></script>
<script type="module" src="profile.js"></script>
</body>
</html>
