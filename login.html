<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rasoi — Log in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <div class="brand-panel">
    <div class="brand-mark">Rasoi</div>
    <div class="brand-copy">
      <h1>Welcome back to your collection.</h1>
      <p>Pick up right where you left off — every saved recipe, one login away.</p>
    </div>

  </div>


  <div class="form-panel">
    <div class="form-card">
      <p class="eyebrow">Welcome back</p>
      <h2>Let's Start</h2>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
          <p class="err-msg" id="emailError"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
          <p class="err-msg" id="passwordError"></p>
        </div>

        <button type="submit" class="btn-primary">Log in</button>

        <div class="divider">or</div>

        <button type="button" class="btn-google" id="googleLoginBtn">
       <img src="google.svg" alt="">
          Continue with Google
        </button>
        <p class="form-google-err" id="googleError"></p>
      </form>

      <p class="switch-line">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

</div>

<script type="module" src="signin.js"></script>


</body>
</html>
