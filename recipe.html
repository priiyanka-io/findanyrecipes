<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rasoi | Recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="recipe.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-left">
    <a href="recipe.html" class="brand">Rasoi</a>
  </div>

 <div class="navbar-search">
  <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
  <input type="text" placeholder="Search recipes..." id="searchInput">
  <button type="button" class="clear-search-btn" id="clearSearchBtn" aria-label="Clear search">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>

  <div class="navbar-right" >
    <a class="favorite-btn" href="profile.html" id="favoriteBtn" aria-label="Favorites">
  ♡
</a>
    <button class="logout-btn" id="logoutBtn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Logout</span>
    </button>

    <a href="profile.html" class="nav-dp-link">
      <div class="nav-dp" id="navDp"></div>
    </a>
  </div>
</nav>


<section class="hero-bar">
 
  <div class="chip-row" id="chipRow">
    <button class="chip active" data-cat="all">All</button>
    
  </div>
</section>


<section class="recipes-section">
  <div class="section-head">
    <h2>All Recipes</h2>
    <span class="count" id="resultCount"></span>
  </div>

  <div class="recipe-grid" id="recipeGrid"></div>
  <p class="empty-state" id="emptyState" hidden></p>
</section>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="recipeModal"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="profile.js"></script>
  <script type="module" src="recipe.js"></script>
    <script type="module" src="logout.js"></script>
</body>
</html>
