<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rasoi — Edit Bio</title>

  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <div class="edit-page">
<nav class="navbar">
  <div class="navbar-left">
    <a href="index.html" class="brand">Rasoi</a>
  </div>

  <div class="navbar-search">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" placeholder="Search recipes..." id="searchInput">
  </div>

  <div class="navbar-right" >
    <a class="favorite-btn" href="profile.html" id="favoriteBtn" aria-label="Favorites">
  ♡
</a>
    <button class="logout-btn" id="logoutBtn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Logout</span>
    </button>

    <a href="profile.html" class="nav-dp-link">
      <div class="nav-dp" id="navDp"></div>
    </a>
  </div>
</nav>
    <div class="edit-card">

      <h2>Edit Bio</h2>

      <p class="subtitle">
        Tell everyone a little about yourself.
      </p>

      <div class="textarea-wrapper">

        <textarea
          id="bioInput"
          maxlength="200"
          rows="5"
          placeholder="Write your bio..."
        ></textarea>

        <div class="character-count">
          <span id="bioCount">0</span>/200
        </div>

      </div>

      <div class="actions">

        <a href="profile.html" class="cancel-btn">
          Cancel
        </a>

        <button
          type="button"
          id="saveBioBtn"
          class="save-btn"
        >
          Save Bio
        </button>

      </div>

      <p id="bioError" class="error-message"></p>

    </div>

  </div>


  <script type="module" src="profile.js"></script>

</body>
</html>
